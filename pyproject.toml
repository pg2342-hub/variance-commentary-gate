[project]
name = "variance-commentary-gate"
version = "0.1.0"
description = "Draft budget-vs-actual variance commentary that ties to the ledger, and hold the risky lines for FP&A."
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "golive-gate>=0.1.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools]
packages = ["vcg"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_demo.py" = ["E501"]
